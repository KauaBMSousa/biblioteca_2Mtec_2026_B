name: Code Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-intelligence:
    name: code-intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garantir que a base do PR está disponível localmente
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/code_intelligence/requirements-ci.txt

      - name: Instalar dependências do code-intelligence
        run: pip install --disable-pip-version-check -r .github/code_intelligence/requirements-ci.txt

      - name: Rodar verificação de regressões (PR vs. main)
        id: verificacao
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verificar_code_intelligence.py
