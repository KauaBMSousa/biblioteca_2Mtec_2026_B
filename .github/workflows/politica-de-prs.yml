name: Política de Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verificar-politica-pr:
    name: verificar-politica-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rodar verificação
        id: verificacao
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/verificar_politica_pr.py

      - name: Publicar resultado no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const corpo = fs.readFileSync('/tmp/comentario.md', 'utf8');
            const marcador = '<!-- pr-policy-bot -->';
            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existente = comentarios.find(c => c.body.includes(marcador));
            if (existente) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existente.id,
                body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: corpo,
              });
            }
